# Default values for jinja-template-operator.

# Operator configuration
operator:
  # Global default for OwnerReference on generated resources.
  # Individual CRs can override via spec.setOwnerReference.
  defaultOwnerReference: true

  # RawObject output configuration.
  #
  # RawObject outputs are authorized via ServiceAccount impersonation: the
  # operator applies and deletes the rendered object as the ServiceAccount
  # named in spec.output.serviceAccountName (same namespace as the CR).
  # Grant that ServiceAccount RBAC on the target kind — see
  # examples/calico-globalnetworkpolicy/.
  rawObjects:
    # Optional ValidatingAdmissionPolicy guard: requires the author of a
    # JinjaTemplate with a RawObject output to hold "impersonate" permission
    # on the referenced ServiceAccount. Closes the confused-deputy gap where
    # "create jinjatemplates" in a namespace implies using any ServiceAccount
    # that exists there.
    #
    # Requires Kubernetes >= 1.30 (VAP GA incl. CEL authorizer). Default off:
    # with GitOps controllers the author is the controller's identity, which
    # would itself need impersonate permission on the ServiceAccounts.
    authorCheck:
      enabled: false

# Number of replicas
replicaCount: 1

# Container image configuration
image:
  repository: guidedtraffic/jinja-template-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service account configuration
serviceAccount:
  # Whether to create a service account
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# RBAC configuration
rbac:
  # Whether to create aggregate ClusterRoles that add JinjaTemplate
  # permissions to the default Kubernetes admin, edit and view roles.
  createAggregateClusterRoles: true

# Pod-level settings
podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# Leader election
leaderElection:
  enabled: true

# Logging
logLevel: info

# Health probes
healthProbe:
  port: 8081

# Metrics
metrics:
  port: 8080

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
