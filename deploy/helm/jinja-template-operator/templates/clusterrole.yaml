apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "jinja-template-operator.fullname" . }}-manager-role
  labels:
    {{- include "jinja-template-operator.labels" . | nindent 4 }}
rules:
  # JinjaTemplate CR management
  - apiGroups:
      - jto.gtrfc.com
    resources:
      - jinjatemplates
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - jto.gtrfc.com
    resources:
      - jinjatemplates/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - jto.gtrfc.com
    resources:
      - jinjatemplates/finalizers
    verbs:
      - update
  # ConfigMap management (read sources + create/update outputs)
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Secret management (read sources + create/update outputs)
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # ServiceAccount impersonation for RawObject outputs: the operator applies
  # and deletes RawObject outputs as the ServiceAccount named in the CR
  # (spec.output.serviceAccountName). "get" backs the fail-closed existence
  # check. The same-namespace rule is enforced in the controller code.
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - impersonate
  # Event recording
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
  {{- if .Values.leaderElection.enabled }}
  # Leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  {{- end }}
