version: "2"
run:
  allow-parallel-runners: true
linters:
  enable:
    - goconst
    - misspell
    - prealloc
    - revive
    - unconvert
    - unparam
  settings:
    goconst:
      min-len: 3
      min-occurrences: 3
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        # skip-package-name-checks: internal/template intentionally shadows a
        # stdlib package name; the layout is fixed by the project spec.
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - goconst
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/guided-traffic/jinja-template-operator
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
