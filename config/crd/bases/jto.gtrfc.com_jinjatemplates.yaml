apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: jinjatemplates.jto.gtrfc.com
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: jto.gtrfc.com
  names:
    kind: JinjaTemplate
    listKind: JinjaTemplateList
    plural: jinjatemplates
    singular: jinjatemplate
    shortNames:
      - jt
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Output Kind
          type: string
          jsonPath: .spec.output.kind
        - name: Output Name
          type: string
          jsonPath: .spec.output.name
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: JinjaTemplate is the Schema for the jinjaTemplates API.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              description: >-
                APIVersion defines the versioned schema of this representation
                of an object.
              type: string
            kind:
              description: >-
                Kind is a string value representing the REST resource this
                object represents.
              type: string
            metadata:
              type: object
            spec:
              description: JinjaTemplateSpec defines the desired state of a JinjaTemplate.
              type: object
              required:
                - output
              properties:
                sources:
                  description: Sources defines the variable sources for the Jinja template context.
                  type: array
                  items:
                    description: Source defines a single variable source for the template context.
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        description: Name is the variable name used in the template.
                        type: string
                      configMap:
                        description: ConfigMap references a ConfigMap as the source.
                        type: object
                        properties:
                          name:
                            description: Name is the name of the ConfigMap (for direct reference).
                            type: string
                          key:
                            description: Key is the key within the ConfigMap (for direct reference).
                            type: string
                          labelSelector:
                            description: LabelSelector selects ConfigMaps by labels.
                            type: object
                            properties:
                              matchLabels:
                                description: matchLabels is a map of key-value pairs.
                                type: object
                                additionalProperties:
                                  type: string
                              matchExpressions:
                                description: matchExpressions is a list of label selector requirements.
                                type: array
                                items:
                                  type: object
                                  required:
                                    - key
                                    - operator
                                  properties:
                                    key:
                                      type: string
                                    operator:
                                      type: string
                                    values:
                                      type: array
                                      items:
                                        type: string
                      dns:
                        description: >-
                          DNS resolves DNS records as the source. The lookup result
                          is always a sorted list of IP address strings. CNAME chains
                          are followed recursively (max 10 hops) until IP records are
                          reached.
                        type: object
                        required:
                          - host
                        properties:
                          host:
                            description: Host is the DNS name to resolve.
                            type: string
                          recordType:
                            description: >-
                              RecordType is the address record type to query: "A",
                              "AAAA" or "A+AAAA" (both families combined). CNAME
                              chains are followed transparently; the result contains
                              only IP addresses.
                            type: string
                            enum:
                              - A
                              - AAAA
                              - A+AAAA
                            default: A
                          refreshIntervalSeconds:
                            description: >-
                              RefreshIntervalSeconds forces re-resolution after a
                              fixed interval. If omitted, the record's TTL drives
                              the refresh.
                            type: integer
                            format: int32
                            minimum: 1
                          nameserver:
                            description: >-
                              Nameserver is an optional DNS server ("host" or
                              "host:port", port defaults to 53), also used for every
                              hop of a CNAME chain. If omitted, the system default
                              resolver is used.
                            type: string
                          removalGracePeriodSeconds:
                            description: >-
                              RemovalGracePeriodSeconds keeps a record in the rendered
                              list for this long after it stops appearing in successful
                              lookup responses (including NXDOMAIN, which counts as an
                              empty response). 0 or omitted means immediate removal.
                              Failed lookups (timeout, SERVFAIL) do not age records;
                              the last known state stays valid.
                            type: integer
                            format: int32
                            minimum: 0
                      secret:
                        description: Secret references a Secret as the source.
                        type: object
                        properties:
                          name:
                            description: Name is the name of the Secret (for direct reference).
                            type: string
                          key:
                            description: Key is the key within the Secret (for direct reference).
                            type: string
                          labelSelector:
                            description: LabelSelector selects Secrets by labels.
                            type: object
                            properties:
                              matchLabels:
                                description: matchLabels is a map of key-value pairs.
                                type: object
                                additionalProperties:
                                  type: string
                              matchExpressions:
                                description: matchExpressions is a list of label selector requirements.
                                type: array
                                items:
                                  type: object
                                  required:
                                    - key
                                    - operator
                                  properties:
                                    key:
                                      type: string
                                    operator:
                                      type: string
                                    values:
                                      type: array
                                      items:
                                        type: string
                template:
                  description: Template is an inline Jinja template string.
                  type: string
                templateFrom:
                  description: TemplateFrom references an external template stored in a ConfigMap.
                  type: object
                  properties:
                    configMapRef:
                      description: ConfigMapRef references a ConfigMap containing the template.
                      type: object
                      required:
                        - name
                        - key
                      properties:
                        name:
                          description: Name is the name of the ConfigMap.
                          type: string
                        key:
                          description: Key is the key in the ConfigMap containing the template.
                          type: string
                output:
                  description: Output defines the target resource for the rendered template.
                  type: object
                  required:
                    - kind
                  x-kubernetes-validations:
                    - rule: "has(self.serviceAccountName) == (self.kind == 'RawObject')"
                      message: >-
                        serviceAccountName is required for RawObject outputs and
                        must not be set for ConfigMap/Secret outputs
                  properties:
                    kind:
                      description: >-
                        Kind is the kind of the output resource. With "RawObject"
                        the rendered template must be a complete Kubernetes manifest
                        (single YAML document including apiVersion, kind and
                        metadata.name); name, key and keys must not be set and
                        serviceAccountName is required.
                      type: string
                      enum:
                        - ConfigMap
                        - Secret
                        - RawObject
                    serviceAccountName:
                      description: >-
                        Name of the ServiceAccount in the CR's own namespace whose
                        identity the operator impersonates when applying and deleting
                        the RawObject output. Authorization is plain Kubernetes RBAC
                        granted to that ServiceAccount (get/create/patch/delete on
                        the target kind). Required for RawObject outputs; must not
                        be set for ConfigMap/Secret outputs.
                      type: string
                      maxLength: 63
                      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                    name:
                      description: >-
                        Name of the output resource. Defaults to the CR name.
                        Must not be set for RawObject outputs (the name comes from
                        the rendered manifest's metadata.name).
                      type: string
                    key:
                      description: >-
                        Key is the data key in the output ConfigMap or Secret where
                        the rendered template content is stored. Defaults to "content".
                        Ignored when keys is set.
                      type: string
                    keys:
                      description: >-
                        Keys defines a list of individual key-template pairs to write
                        into the output Secret or ConfigMap. When set, the top-level
                        template/templateFrom fields and output.key are ignored. Each
                        entry is rendered independently using the same sources context.
                      type: array
                      items:
                        type: object
                        required:
                          - key
                        properties:
                          key:
                            description: Key name in the output Secret or ConfigMap.
                            type: string
                          template:
                            description: >-
                              Inline Jinja template string for this key's value.
                              The rendered value is trimmed of leading/trailing whitespace.
                            type: string
                          templateFrom:
                            description: Reference to an external template for this key's value.
                            type: object
                            properties:
                              configMapRef:
                                description: ConfigMapRef references a ConfigMap containing the template.
                                type: object
                                required:
                                  - name
                                  - key
                                properties:
                                  name:
                                    description: Name is the name of the ConfigMap.
                                    type: string
                                  key:
                                    description: Key is the key in the ConfigMap containing the template.
                                    type: string
                setOwnerReference:
                  description: >-
                    SetOwnerReference controls whether the generated resource has
                    an OwnerReference pointing to the JinjaTemplate CR.
                  type: boolean
            status:
              description: JinjaTemplateStatus defines the observed state of a JinjaTemplate.
              type: object
              properties:
                lastOutput:
                  description: >-
                    LastOutput records the most recently created output resource.
                    Used to detect output target changes and clean up the old resource.
                  type: object
                  required:
                    - kind
                    - name
                  properties:
                    kind:
                      description: >-
                        Kind of the output resource. For RawObject outputs this is
                        the actual kind of the rendered manifest.
                      type: string
                    name:
                      description: Name of the output resource.
                      type: string
                    apiVersion:
                      description: >-
                        APIVersion of the output resource. Empty for ConfigMap/Secret
                        outputs; set for RawObject outputs.
                      type: string
                    namespace:
                      description: >-
                        Namespace of the output resource. Set for namespaced RawObject
                        outputs; empty for cluster-scoped RawObject outputs and for
                        ConfigMap/Secret outputs (which always live in the CR's
                        namespace).
                      type: string
                    serviceAccountName:
                      description: >-
                        ServiceAccount identity (in the CR's namespace) that created
                        this output. Cleanup after a target or ServiceAccount change
                        runs under this identity. Set for RawObject outputs only.
                      type: string
                dnsSources:
                  description: >-
                    DNSSources tracks the resolved state of each DNS source, keyed
                    by source name. Persists last known records across lookups and
                    operator restarts; drives stale-on-error behavior and removal
                    grace periods.
                  type: array
                  items:
                    description: DNSSourceStatus records the resolved state of a single DNS source.
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        description: Name is the source name from spec.sources.
                        type: string
                      records:
                        description: >-
                          Records are the currently effective records, including
                          those held through a removal grace period.
                        type: array
                        items:
                          description: DNSRecord is one resolved value with bookkeeping for grace-period removal.
                          type: object
                          required:
                            - value
                            - lastSeen
                          properties:
                            value:
                              description: Value is the resolved IP address.
                              type: string
                            lastSeen:
                              description: LastSeen is the last time this value appeared in a lookup response.
                              type: string
                              format: date-time
                      lastSuccessfulLookup:
                        description: LastSuccessfulLookup is the time of the last successful DNS query.
                        type: string
                        format: date-time
                      lastError:
                        description: LastError is the error of the most recent failed lookup, empty on success.
                        type: string
                conditions:
                  description: Conditions represent the latest available observations.
                  type: array
                  items:
                    description: Condition contains details for one aspect of the current state.
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is the last time the condition transitioned.
                        type: string
                        format: date-time
                      message:
                        description: message is a human readable message indicating details.
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        description: observedGeneration represents the generation that the condition was set based upon.
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        description: reason contains a programmatic identifier indicating the reason.
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      status:
                        description: status of the condition.
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      type:
                        description: type of condition in CamelCase.
                        type: string
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
